baseURL: 'https://simplemath.top'
locale: 'zh-CN'
title: 'SimpleMath'
theme: 'PaperMod'
enableGitInfo: true

# lastmod 优先取 git 提交日期（enableGitInfo 配合），用于面板「最后更新」展示
frontmatter:
  lastmod:
    - ':git'
    - 'lastmod'
    - 'date'
    - 'publishDate'

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
            - ['$$', '$$']
          inline:
            - ['$', '$']
        enable: true

params:
  env: production
  defaultTheme: auto
  description: "SimpleMath：以代数表示论与同调代数为主的数学博客，兼有数学文化与 AI 与数学专题。"
  assets:
    theme_color: '#ffffff'
    msapplication_TileColor: '#ffffff'
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  profileMode:
    enabled: true
    title: "SimpleMath"
    imageUrl: ""
    buttons:
      - name: "AI"
        url: /posts/aimath/
      - name: "数学文化"
        url: /posts/数学文化/
      - name: "代数表示论同调代数"
        url: /posts/代数表示论/

menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

languages:
  zh:
    label: "中文"
    weight: 1
